name: Skill Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: skill-quality-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Preview repository formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Trunk
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: none
      - name: Apply Trunk formatting locally
        run: "${TRUNK_PATH}" fmt -a
      - name: Print formatter diff
        run: git --no-pager diff -- .claude-plugin/plugin.json README.md catalog/catalog.json docs/compatibility.md evals/README.md evals/manifest.json policies/risk-levels.md
