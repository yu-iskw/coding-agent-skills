name: Skill Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: skill-quality-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Apply repository formatting
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Trunk
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: none
      - name: Apply Trunk formatting
        run: "${TRUNK_PATH}" fmt -a
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Trunk formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
