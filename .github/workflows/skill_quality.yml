name: Skill Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: skill-quality-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Conformance, contracts, security, generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        run: python3 -m pip install --user uv
      - name: Run skill quality gate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make check
