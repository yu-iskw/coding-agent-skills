name: Trunk Check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: trunk-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Check Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply pinned Prettier locally
        run: |
          npx --yes prettier@3.8.1 --write \
            .claude-plugin/plugin.json \
            README.md \
            catalog/catalog.json \
            docs/compatibility.md \
            evals/README.md \
            evals/manifest.json \
            policies/risk-levels.md
      - name: Print formatter diff
        run: git --no-pager diff -- .claude-plugin/plugin.json README.md catalog/catalog.json docs/compatibility.md evals/README.md evals/manifest.json policies/risk-levels.md
